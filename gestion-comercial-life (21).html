<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gestión Comercial LIFE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --navy:#5B2A86; --navy-light:#7A3FAE; --navy-dark:#371755;
    --ice:#E9DBF5; --ice-soft:#F7F1FC;
    --gold:#C9A64B; --gold-soft:#F1E4C0;
    --bg:#F6F4FA; --card:#FFFFFF;
    --text:#241934; --muted:#746B85; --line:#E7E1F0;
    --ok:#2E8B57; --ok-soft:#E1F3EA;
    --warn:#B8791A; --warn-soft:#FBEDD6;
    --bad:#B3392C; --bad-soft:#FBE4E1;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg); color:var(--text);
    font-family:'Inter',system-ui,sans-serif; font-size:15px; line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,h4,.num{font-family:'Manrope',system-ui,sans-serif;}
  h1,h2,h3,h4{margin:0; color:var(--navy);}
  button{font-family:inherit; cursor:pointer;}
  input,select,textarea{font-family:inherit; font-size:14px;}
  a{color:inherit;}
  ::selection{background:var(--gold-soft);}

  /* top bar */
  .topbar{
    background:var(--navy); color:#fff; padding:14px 24px;
    display:flex; align-items:center; justify-content:space-between;
    position:sticky; top:0; z-index:20; box-shadow:0 2px 12px rgba(20,26,71,.18);
    border-bottom:3px solid var(--gold);
  }
  .brand{display:flex; align-items:center; gap:10px;}
  .brand .mark{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,var(--gold),#E8CE85);display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--navy-dark);font-family:'Manrope';font-size:15px;}
  .brand .name{font-family:'Manrope';font-weight:800;font-size:16px;letter-spacing:.2px;}
  .brand .sub{font-size:11px;color:var(--ice);opacity:.85;margin-top:-2px;}
  .topbar-right{display:flex;align-items:center;gap:14px;font-size:13px;}
  .pill{background:rgba(255,255,255,.12); padding:6px 12px; border-radius:999px; font-size:12.5px; display:flex; align-items:center; gap:6px;}
  .btn-ghost{background:transparent;border:1px solid rgba(255,255,255,.35);color:#fff;padding:7px 13px;border-radius:9px;font-size:12.5px;font-weight:600;}
  .btn-ghost:hover{background:rgba(255,255,255,.1);}

  .wrap{max-width:1180px;margin:0 auto;padding:26px 20px 70px;}

  /* generic */
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px;}
  .card+.card{margin-top:16px;}
  .grid{display:grid;gap:16px;}
  .grid-2{grid-template-columns:1fr 1fr;}
  .grid-3{grid-template-columns:repeat(3,1fr);}
  .grid-4{grid-template-columns:repeat(4,1fr);}
  @media(max-width:800px){.grid-2,.grid-3,.grid-4{grid-template-columns:1fr;}}

  .btn{background:var(--navy);color:#fff;border:none;padding:11px 18px;border-radius:10px;font-weight:700;font-size:13.5px;letter-spacing:.2px;}
  .btn:hover{background:var(--navy-light);}
  .btn.gold{background:var(--gold);color:var(--navy-dark);}
  .btn.gold:hover{background:#D9BE72;}
  .btn.outline{background:transparent;border:1.5px solid var(--navy);color:var(--navy);}
  .btn.outline:hover{background:var(--ice-soft);}
  .btn.sm{padding:7px 12px;font-size:12.5px;border-radius:8px;}
  .btn.danger{background:var(--bad);color:#fff;}
  .btn:disabled{opacity:.45;cursor:not-allowed;}

  .badge{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:700;}
  .badge.ok{background:var(--ok-soft);color:var(--ok);}
  .badge.warn{background:var(--warn-soft);color:var(--warn);}
  .badge.bad{background:var(--bad-soft);color:var(--bad);}
  .badge.sd{background:var(--line);color:var(--muted);}
  .dot{width:8px;height:8px;border-radius:50%;display:inline-block;}
  .dot.ok{background:var(--ok);} .dot.warn{background:var(--warn);} .dot.bad{background:var(--bad);}

  label{display:block;font-size:12.5px;font-weight:700;color:var(--muted);margin-bottom:5px;text-transform:uppercase;letter-spacing:.4px;}
  input[type=text],input[type=number],input[type=date],select,textarea{
    width:100%;padding:9px 11px;border:1.5px solid var(--line);border-radius:9px;background:#fff;color:var(--text);
  }
  input:focus,select:focus,textarea:focus{outline:2px solid var(--ice);border-color:var(--navy-light);}
  textarea{min-height:64px;resize:vertical;}
  .field{margin-bottom:14px;}
  .row-inline{display:flex;gap:10px;}
  .row-inline>*{flex:1;}

  .section-title{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
  .section-title .idx{width:26px;height:26px;border-radius:7px;background:var(--ice-soft);color:var(--navy);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12.5px;font-family:'Manrope';}
  .section-title h3{font-size:15.5px;}
  .section-title .hint{font-size:12px;color:var(--muted);font-weight:500;margin-left:auto;}

  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);padding:8px 10px;border-bottom:1.5px solid var(--line);}
  td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle;}
  tr:last-child td{border-bottom:none;}
  .table-wrap{overflow-x:auto;}

  /* pulse strip */
  .pulse{display:flex;align-items:flex-end;gap:3px;height:34px;}
  .pulse .bar{flex:1;background:var(--ice);border-radius:3px 3px 0 0;min-height:3px;}
  .pulse .bar.zero{background:var(--bad-soft);}

  .asesor-card{border:1px solid var(--line);border-radius:12px;padding:15px 16px;display:flex;flex-direction:column;gap:10px;background:#fff;transition:box-shadow .15s;}
  .asesor-card:hover{box-shadow:0 4px 18px rgba(30,39,97,.08);}
  .asesor-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
  .asesor-name{font-weight:700;font-size:14.5px;color:var(--navy);}
  .asesor-meta{font-size:12px;color:var(--muted);margin-top:2px;}
  .asesor-alerts{font-size:12px;color:var(--bad);font-weight:600;}

  .kpi{padding:16px;border-radius:12px;background:var(--card);border:1px solid var(--line);}
  .kpi .num{font-size:26px;font-weight:800;color:var(--navy);}
  .kpi .lbl{font-size:12px;color:var(--muted);margin-top:2px;}

  .tabbar{display:flex;gap:6px;margin-bottom:18px;border-bottom:1.5px solid var(--line);}
  .tab{padding:10px 16px;font-size:13.5px;font-weight:700;color:var(--muted);border-bottom:2.5px solid transparent;background:none;border-radius:0;}
  .tab.active{color:var(--navy);border-color:var(--gold);}

  .banner{background:var(--gold-soft);border:1px solid var(--gold);color:#6B5316;padding:12px 16px;border-radius:10px;font-size:13px;margin-bottom:18px;}
  .banner.info{background:var(--ice-soft);border-color:var(--ice);color:var(--navy);}
  .banner strong{font-weight:700;}

  .compromiso-row{border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px;background:#FBFCFE;}
  .info-card{border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px;background:#FBFCFE;}
  .seguimiento-row{border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px;}
  .seguimiento-row .txt{font-weight:600;font-size:13.5px;margin-bottom:8px;}
  .estado-btns{display:flex;gap:6px;margin-bottom:8px;}
  .estado-btn{padding:6px 12px;border-radius:8px;border:1.5px solid var(--line);background:#fff;font-size:12.5px;font-weight:700;color:var(--muted);}
  .estado-btn.sel-cumplido{background:var(--ok-soft);border-color:var(--ok);color:var(--ok);}
  .estado-btn.sel-parcial{background:var(--warn-soft);border-color:var(--warn);color:var(--warn);}
  .estado-btn.sel-incumplido{background:var(--bad-soft);border-color:var(--bad);color:var(--bad);}

  .back-link{display:inline-flex;align-items:center;gap:6px;color:var(--navy);font-weight:700;font-size:13px;margin-bottom:16px;background:none;border:none;padding:0;}
  .back-link:hover{text-decoration:underline;}

  .empty{text-align:center;padding:50px 20px;color:var(--muted);}
  .empty h3{color:var(--text);margin-bottom:6px;}

  .login-wrap{min-height:80vh;display:flex;align-items:center;justify-content:center;}
  .login-card{background:#fff;border-radius:18px;padding:38px;max-width:440px;width:100%;box-shadow:0 20px 60px rgba(20,26,71,.12);border:1px solid var(--line);}
  .login-card h1{font-size:22px;margin-bottom:4px;}
  .login-card p{color:var(--muted);font-size:13.5px;margin:0 0 22px;}

  footer.note{font-size:11.5px;color:var(--muted);text-align:center;margin-top:30px;}

  details.collapsible{border:1px solid var(--line);border-radius:var(--radius);padding:14px 20px;margin-top:16px;background:var(--card);}
  details.collapsible summary{cursor:pointer;font-weight:700;color:var(--navy);font-size:14px;list-style:none;}
  details.collapsible summary::-webkit-details-marker{display:none;}
  details.collapsible summary:before{content:'+ ';color:var(--gold);font-weight:800;}
  details.collapsible[open] summary:before{content:'– ';}
  details.collapsible .grid{margin-top:14px;}

  .meta-box{display:flex;align-items:center;gap:8px;margin-top:6px;}
  .meta-box input{width:64px;padding:5px 7px;font-size:12.5px;}
  .meta-box .btn{padding:5px 9px;font-size:11.5px;}
  .progress{height:7px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:6px;}
  .progress .fill{height:100%;background:var(--gold);}
  .progress .fill.over{background:var(--ok);}

  /* hero de marca */
  .eyebrow{display:flex;align-items:center;gap:10px;color:var(--gold);font-size:11.5px;font-weight:800;letter-spacing:1.6px;text-transform:uppercase;margin-bottom:10px;}
  .eyebrow .bar{width:26px;height:2px;background:var(--gold);}
  .hero{background:linear-gradient(135deg,var(--navy-dark),var(--navy) 55%,var(--navy-light));border-radius:18px;padding:30px 32px;color:#fff;margin-bottom:20px;position:relative;overflow:hidden;}
  .hero:before{content:'';position:absolute;top:-60px;right:-60px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(201,166,75,.18),transparent 70%);}
  .hero h2{color:#fff;font-size:23px;}
  .hero p{color:var(--ice);font-size:13.5px;margin:6px 0 0;max-width:640px;}

  /* gráfico de línea */
  .linechart-wrap{display:flex;align-items:flex-end;gap:18px;}
  .linechart-delta{font-family:'Manrope';font-weight:800;font-size:15px;white-space:nowrap;padding:8px 14px;border-radius:10px;}
  .linechart-delta.up{background:var(--ok-soft);color:var(--ok);}
  .linechart-delta.down{background:var(--bad-soft);color:var(--bad);}
  .linechart-delta.flat{background:var(--ice-soft);color:var(--navy);}

  /* carga de excel */
  .upload-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:16px 0;}
  @media(max-width:1000px){.upload-grid{grid-template-columns:repeat(2,1fr);}}
  @media(max-width:800px){.upload-grid{grid-template-columns:1fr;}}
  .upload-card{border:1.5px dashed var(--line);border-radius:12px;padding:18px;text-align:center;background:var(--ice-soft);transition:.15s;}
  .upload-card.filled{border-style:solid;border-color:var(--gold);background:var(--gold-soft);}
  .upload-card .ic{font-size:24px;margin-bottom:6px;}
  .upload-card .lbl{font-weight:700;font-size:13px;color:var(--navy);}
  .upload-card .sub{font-size:11.5px;color:var(--muted);margin-top:2px;}
  .upload-card input{margin-top:10px;font-size:11.5px;width:100%;}
</style>
</head>

const PREGUNTAS_VERSION = 4; // subir este número cada vez que se cambie el banco de preguntas por defecto, para que se refresque solo en navegadores con datos viejos guardados

/* ---------------------------- Capa de datos ---------------------------- */
let DATA = {roster:[], minutas:[], config: defaultConfig()};

function backfillLegajos(roster){
  let changed = false;
  roster.forEach(r=>{
    if(!r.Legajo){
      const match = ROSTER_INICIAL.find(x=>x.Asesor===r.Asesor && x.Supervisor===r.Supervisor);
      if(match){ r.Legajo = match.Legajo; changed = true; }
    }
  });
  return changed;
}

function loadLocal(){
  const raw = localStorage.getItem(LS_KEY);
  if(raw){ try{ DATA = JSON.parse(raw); }catch(e){} }
  if(!DATA.config || !DATA.config.umbrales) DATA.config = defaultConfig();
  normalizarPreguntas(DATA.config);
  if(!DATA.roster || !DATA.roster.length) DATA.roster = ROSTER_INICIAL;
  else backfillLegajos(DATA.roster);
  if(!DATA.minutas) DATA.minutas = [];
  saveLocal();
}
function normalizarPreguntas(config){
  if(!config.preguntasCoaching) return false;
  config.preguntasCoaching = config.preguntasCoaching.map(p=> typeof p==='string' ? {texto:p, foco:'General'} : p);
  if((config.preguntasVersion||0) < PREGUNTAS_VERSION){
    config.preguntasCoaching = defaultConfig().preguntasCoaching;
    config.preguntasVersion = PREGUNTAS_VERSION;
    return true; // se pisó el banco viejo — conviene persistir el cambio
  }
  return false;
}
function saveLocal(){ localStorage.setItem(LS_KEY, JSON.stringify(DATA)); }

function jsonp(url){
  return new Promise((resolve,reject)=>{
    const cb = 'cb_' + Date.now() + '_' + Math.floor(Math.random()*10000);
    window[cb] = (data)=>{ resolve(data); delete window[cb]; script.remove(); };
    const script = document.createElement('script');
    script.src = url + (url.indexOf('?')>-1?'&':'?') + 'callback=' + cb;
    script.onerror = ()=>{ reject(new Error('No se pudo conectar al backend')); delete window[cb]; };
    document.body.appendChild(script);
    setTimeout(()=>{ if(window[cb]){ reject(new Error('Timeout')); delete window[cb]; } }, 12000);
  });
}

async function apiLoad(){
  if(DEMO_MODE){ loadLocal(); return DATA; }
  const data = await jsonp(BACKEND_URL);
  if(!data.config || !data.config.umbrales) data.config = defaultConfig();
  if(normalizarPreguntas(data.config)) apiSaveConfig(data.config);
  if(!data.roster) data.roster = [];
  if(backfillLegajos(data.roster)) apiSaveRoster(data.roster);
  DATA = data;
  return DATA;
}

async function apiSaveMinuta(minuta){
  if(DEMO_MODE){
    const i = DATA.minutas.findIndex(m=>m.Supervisor===minuta.Supervisor && m.Asesor===minuta.Asesor && m.Semana===minuta.Semana);
    minuta.Timestamp = new Date().toISOString();

/* ---------------------------- Utilidades de dominio ---------------------------- */
function isoWeekNumber(date){
  const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
  const day = d.getUTCDay() || 7;
  d.setUTCDate(d.getUTCDate() + 4 - day);
  const yearStart = new Date(Date.UTC(d.getUTCFullYear(),0,1));
  return Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
}
const FOCOS = ['Prospección','Referidos','Gestión de cartera','Detección de necesidades','Objeciones','Presentación y propuesta','Cierre','Seguimiento','Organización / disciplina comercial'];

function preguntasDeLaSemana(semanaISO, foco){
  const bankFull = DATA.config.preguntasCoaching || [];
  // compat: si algún banco viejo quedó como array de strings, lo normalizo
  const bank = bankFull.map(p=> typeof p==='string' ? {texto:p, foco:'General'} : p);
  if(!bank.length) return [];
  let pool = foco ? bank.filter(p=>p.foco===foco || p.foco==='General') : bank;
  if(!pool.length) pool = bank;
  const count = Math.min(pool.length, DATA.config.preguntasPorSemana || 3);
  const week = isoWeekNumber(new Date(semanaISO+'T00:00:00'));
  const start = week % pool.length;
  const out = [];
  for(let i=0;i<count;i++){
    const p = pool[(start+i)%pool.length];
    out.push({idx: bank.indexOf(p), texto:p.texto});
  }
  return out;
}
function avanceMensualPrevio(asesor, supervisor, semanaActual){
  const mes = semanaActual.slice(0,7);
  return minutasDe(asesor,supervisor)
    .filter(m=>m.Semana.slice(0,7)===mes && m.Semana!==semanaActual)
    .reduce((s,m)=>s+n(m.PrimaSemana),0);
}

function pad(n){ return n<10?'0'+n:''+n; }
function toISO(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function mondayOf(date){
  const d = new Date(date);
  const day = d.getDay();
  const diff = (day===0? -6 : 1) - day;
  d.setDate(d.getDate()+diff);
  return d;
}
function currentSemana(){ return toISO(mondayOf(new Date())); }
function addWeeks(iso,n){
  const d = new Date(iso+'T00:00:00');
  d.setDate(d.getDate()+7*n);
  return toISO(d);
}
function mesesAntiguedad(fechaIngresoISO){
  if(!fechaIngresoISO) return null;
  const ing = new Date(fechaIngresoISO);
  if(isNaN(ing)) return null;
  const now = new Date();
  return (now.getFullYear()-ing.getFullYear())*12 + (now.getMonth()-ing.getMonth());
}
function etapaCurva(meses){
  if(meses===null) return '12+';
  if(meses<3) return '0-3';
  if(meses<6) return '3-6';
  if(meses<12) return '6-12';
  return '12+';
}
function etapaLabel(e){
  return {'0-3':'0–3 meses (inicio)','3-6':'3–6 meses','6-12':'6–12 meses','12+':'+12 meses (senior)'}[e];
}
function n(v){ const x = Number(v); return isNaN(x)?0:x; }

/* Objetivo mensual escalonado real 2026 (mismo criterio que Inteligencia Comercial VIDA / KPI Riesgo).
   Junior = 70% del Senior de CADA mes. 2025 sin desglose real, se usa una estimación plana. */
const OBJETIVO_SENIOR_2026 = {1:350000,2:350000,3:400000,4:450000,5:485310,6:510000,7:510000,8:510000,9:510000,10:510000,11:510000,12:510000};
const OBJETIVO_SENIOR_2025_EST = 365000;
function objetivoDelMes(anio, mes, esSenior){
  const senior = (Number(anio)===2026) ? (OBJETIVO_SENIOR_2026[Number(mes)]||510000) : OBJETIVO_SENIOR_2025_EST;
  return esSenior ? senior : Math.round(senior*0.7);
}
function esSeniorEnFecha(fechaIngresoISO, anio, mes){
  if(!fechaIngresoISO) return true;
  const ing = new Date(fechaIngresoISO);
  const ref = new Date(anio, mes-1, 1);
  const meses = (ref.getFullYear()-ing.getFullYear())*12 + (ref.getMonth()-ing.getMonth());
  return meses>=12;
}
function objetivoMensualActual(fechaIngresoISO){
  const now = new Date();
  return objetivoDelMes(now.getFullYear(), now.getMonth()+1, esSeniorEnFecha(fechaIngresoISO, now.getFullYear(), now.getMonth()+1));
}
const MESES_CORTOS = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
function ymLabel(ym){
  const [anio,mes] = ym.split('-').map(Number);
  return MESES_CORTOS[mes-1] + (anio!==new Date().getFullYear() ? " '"+String(anio).slice(2) : '');
}

/* Gráfico de línea con puntos — sin librerías, SVG a mano. points: [{label, value}] */
function svgLineChart(points, opts){
  opts = opts || {};
  const w = opts.width || 560, h = opts.height || 150, pad = 28;
  if(!points.length) return '<div style="font-size:12px;color:var(--muted)">Sin datos suficientes</div>';
  const vals = points.map(p=>p.value);
  const max = Math.max(...vals, 1), min = Math.min(...vals, 0);
  const range = (max-min)||1;
  const stepX = points.length>1 ? (w-2*pad)/(points.length-1) : 0;
  const xy = points.map((p,i)=>{
    const x = pad + i*stepX;
    const y = h-pad - ((p.value-min)/range)*(h-2*pad);
    return {x,y,...p};
  });
  const path = xy.map((p,i)=> (i===0?'M':'L')+p.x.toFixed(1)+','+p.y.toFixed(1)).join(' ');
  const areaPath = path + ` L${xy[xy.length-1].x.toFixed(1)},${h-pad} L${xy[0].x.toFixed(1)},${h-pad} Z`;
  const dots = xy.map((p,i)=>`
    <circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="${i===xy.length-1?5:3.5}" fill="${i===xy.length-1?'#C9A64B':'#5B2A86'}" stroke="#fff" stroke-width="1.5"/>
    <text x="${p.x.toFixed(1)}" y="${h-6}" font-size="10" fill="#666E8C" text-anchor="middle" font-family="Inter">${esc(p.label)}</text>
  `).join('');
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:${h}px" preserveAspectRatio="none">
    <path d="${areaPath}" fill="rgba(201,166,75,.12)" stroke="none"/>
    <path d="${path}" fill="none" stroke="#C9A64B" stroke-width="2.5"/>
    ${dots}
  </svg>`;
}

function minutasDe(asesor, supervisor){
  return DATA.minutas.filter(m=>m.Asesor===asesor && m.Supervisor===supervisor).sort((a,b)=> a.Semana<b.Semana?-1:1);
}
function ultimaMinuta(asesor, supervisor){
  const ms = minutasDe(asesor,supervisor);
  return ms.length? ms[ms.length-1] : null;
}

function produccionDe(legajo){
  if(legajo===undefined || legajo===null || legajo==='') return null;
  const base = ((DATA.config && DATA.config.produccion) || PRODUCCION_INICIAL || {})[String(legajo)] || null;
  const correcciones = (DATA.config.correccionesProduccion||[]).filter(c=>String(c.legajo)===String(legajo));
  if(!correcciones.length) return base;
  return aplicarCorrecciones(base, legajo, correcciones);
}
function anioMasReciente(prodFull){
  if(!prodFull || !prodFull.Anios || !prodFull.Anios.length) return null;
  return Math.max(...prodFull.Anios);
}
function prodDelAnio(prodFull, anio){
  if(!prodFull || anio==null || !prodFull.PorAnio) return null;
  return prodFull.PorAnio[String(anio)] || null;
}
function carteraDe(legajo){
  if(legajo===undefined || legajo===null || legajo==='') return null;
  return ((DATA.config && DATA.config.cartera) || CARTERA_INICIAL || {})[String(legajo)] || null;
}
function aplicarCorrecciones(base, legajo, correcciones){
  let full = base ? JSON.parse(JSON.stringify(base)) : {Anios:[], PorAnio:{}};
  if(!full.PorAnio) full.PorAnio = {};
  if(!full.Anios) full.Anios = [];
  const rosterRow = DATA.roster.find(r=>String(r.Legajo)===String(legajo));
  const fing = rosterRow ? rosterRow.FechaIngreso : null;
  const TIPO_LABEL = {VI:'Nuevas', Bonus:'Incrementos', 'AP Ind':'AP', AP:'AP'};

  correcciones.forEach(c=>{
    const [anio, mes] = c.ym.split('-').map(Number);
    const anioKey = String(anio);
    if(!full.PorAnio[anioKey]){
      full.PorAnio[anioKey] = {PrimaTotal:0,PMPM:0,MesesConDatos:0,AlcancePromedio:null,VentasNuevasCant:0,VentasNuevasPrima:0,IncrementosCant:0,IncrementosPrima:0,APCant:0,APPrima:0,Polizas:0,Evolucion:[],MixProductos:[],MixPorTipo:[]};
      full.Anios.push(anio);
    }
    let p = full.PorAnio[anioKey];

    let ev = p.Evolucion.find(e=>e.ym===c.ym);
    if(!ev){
      const esSr = fing ? esSeniorEnFecha(fing, anio, mes) : true;
      const objetivo = objetivoDelMes(anio, mes, esSr);
      ev = {ym:c.ym, prima:0, objetivo, alcance:0};
      p.Evolucion.push(ev);
      p.Evolucion.sort((a,b)=> a.ym<b.ym?-1:1);
    }
    ev.prima += c.prima;
    ev.alcance = ev.objetivo ? Math.round(100*ev.prima/ev.objetivo) : 0;

    p.PrimaTotal += c.prima;
    if(c.tipoVenta==='VI'){ p.VentasNuevasCant++; p.VentasNuevasPrima += c.prima; }
    else if(c.tipoVenta==='Bonus'){ p.IncrementosCant++; p.IncrementosPrima += c.prima; }
    else if(c.tipoVenta==='AP Ind'){ p.APCant++; p.APPrima += c.prima; }
    p.Polizas += (c.polizas||0);

    const prodName = c.producto || 'Corrección manual';
    let mix = p.MixProductos.find(m=>m.producto===prodName);
    if(!mix){ mix = {producto:prodName, prima:0, pct:0}; p.MixProductos.push(mix); }
    mix.prima += c.prima;

    let cruce = p.MixPorTipo.find(m=>m.producto===prodName && m.tipoVenta===c.tipoVenta);
    if(!cruce){ cruce = {producto:prodName, tipoVenta:c.tipoVenta, tipoLabel:TIPO_LABEL[c.tipoVenta]||c.tipoVenta, cant:0, prima:0}; p.MixPorTipo.push(cruce); }
    cruce.cant += (c.polizas||0);
    cruce.prima += c.prima;
  });

  Object.values(full.PorAnio).forEach(p=>{
    p.MesesConDatos = p.Evolucion.length || 1;
    p.PMPM = Math.round(p.PrimaTotal/p.MesesConDatos);
    const alcances = p.Evolucion.map(e=>Math.min(200, e.alcance));
    p.AlcancePromedio = alcances.length ? Math.round(alcances.reduce((a,b)=>a+b,0)/alcances.length) : null;
    const mixTotal = p.MixProductos.reduce((s,m)=>s+m.prima,0) || 1;
    p.MixProductos.forEach(m=> m.pct = Math.round(100*m.prima/mixTotal));
    p.MixProductos.sort((a,b)=>b.prima-a.prima);
  });
  return full;
}
function oportunidadesDe(prod){
  if(!prod) return [];
  const out = [];
  const mix = prod.MixProductos || [];
  const tieneAP = mix.some(p=>p.producto==='AP Ind');
  if(!tieneAP && prod.PrimaTotal>0) out.push('No vendió AP en el período — es una línea con margen para sumar sin abrir cliente nuevo.');
  if(mix.length===1) out.push(`Toda la producción está concentrada en un solo producto (${mix[0].producto}) — vale la pena diversificar la cartera.`);
  if(prod.IncrementosCant===0 && prod.PrimaTotal>0) out.push('Sin incrementos en el período — hay cartera existente para trabajar antes de salir a buscar cliente nuevo.');
  if(prod.AlcancePromedio!=null && prod.AlcancePromedio<75) out.push('El alcance promedio del año está por debajo del 75% del objetivo — conviene entender qué está frenando el ritmo.');
  return out;
}
function fmtMoney(v){ const x=Number(v); return isNaN(x)?'$0':'$'+x.toLocaleString('es-AR'); }

function prospeccionTotal(m){ return n(m.ProspeccionCartera)+n(m.ProspeccionLinkedIn)+n(m.ProspeccionInstagram); }
function agendaTotal(m){ return n(m.AgendaEntrevistasProgramadas)+n(m.AgendaOportunidadesAbiertas)+n(m.AgendaEntrevistasNuevas)+n(m.AgendaSeguimientos)+n(m.AgendaCierresPrevistos); }
function actividadScore(m){ return n(m.Llamados)+n(m.Entrevistas)*2+n(m.ReferidosSolicitados)*2+prospeccionTotal(m); }

/* Embudo simplificado — con lo que YA se carga semana a semana, sin pedir nada nuevo.
   Propuestas→Ventas no se semaforiza porque compara fuentes de distinto período (minutas vs. producción real). */
function funnelDe(asesor, supervisor, prod){
  const ms = minutasDe(asesor, supervisor);
  const llamados = ms.reduce((s,m)=>s+n(m.Llamados),0);
  const entrevistas = ms.reduce((s,m)=>s+n(m.Entrevistas),0);
  const propuestas = ms.reduce((s,m)=>s+n(m.PropuestasEnviadas),0);
  const ventas = prod ? prod.VentasNuevasCant : null;
  const pct = (a,b)=> (a>0 && b!=null) ? Math.round(100*b/a) : null;
  return {
    llamados, entrevistas, propuestas, ventas,
    convLlamadosEntrevistas: pct(llamados, entrevistas),
    convEntrevistasPropuestas: pct(entrevistas, propuestas),
    tieneDatos: ms.length>0
  };
}

/* Origen del negocio — de dónde sale la prospección que el asesor ya carga cada semana */
function origenDe(asesor, supervisor){
  const ms = minutasDe(asesor, supervisor);
  if(!ms.length) return [];
  const sum = {
    'Cartera': ms.reduce((s,m)=>s+n(m.ProspeccionCartera),0),
    'Redes sociales': ms.reduce((s,m)=>s+n(m.ProspeccionLinkedIn)+n(m.ProspeccionInstagram),0),
    'Empresas': ms.reduce((s,m)=>s+n(m.ProspeccionEmpresas),0),
    'Referidos': ms.reduce((s,m)=>s+n(m.ReferidosObtenidos),0)
  };
  const total = Object.values(sum).reduce((a,b)=>a+b,0);
  if(!total) return [];
  return Object.keys(sum).filter(k=>sum[k]>0).map(k=>({origen:k, valor:sum[k], pct:Math.round(100*sum[k]/total)})).sort((a,b)=>b.valor-a.valor);
}

/* Diagnóstico automático — semáforo de Actividad (llamados/entrevistas vs. meta) y Resultado (alcance real vs. objetivo).
   La "tendencia" usa la evolución mensual real ya calculada para el gráfico de línea. */
function diagnosticoDe(asesorRow, prod){
  const ult = ultimaMinuta(asesorRow.Asesor, asesorRow.Supervisor);
  const meses = mesesAntiguedad(asesorRow.FechaIngreso);
  const etapa = etapaCurva(meses);
  const umbral = DATA.config.umbrales[etapa];
  const metaLlamados = n(asesorRow.MetaLlamados) || (umbral?umbral.llamados:15);

  let actividad = {nivel:'sd', label:'Sin datos'};
  if(ult){
    const okLlamados = n(ult.Llamados) >= metaLlamados;
    const okEntrevistas = umbral ? n(ult.Entrevistas) >= umbral.entrevistas : true;
    if(okLlamados && okEntrevistas) actividad = {nivel:'ok', label:'Adecuada'};
    else if(n(ult.Llamados)===0 && n(ult.Entrevistas)===0) actividad = {nivel:'bad', label:'Crítica'};
    else actividad = {nivel:'warn', label:'Insuficiente'};
  }

  let resultado = {nivel:'sd', label:'Sin datos'};
  if(prod && prod.AlcancePromedio!=null){
    if(prod.AlcancePromedio>=100) resultado = {nivel:'ok', label:'Objetivo alcanzable'};
    else if(prod.AlcancePromedio>=75) resultado = {nivel:'warn', label:'En riesgo'};
    else resultado = {nivel:'bad', label:'Desvío importante'};
  }

  let tendencia = {nivel:'sd', label:'Sin datos'};
  if(prod && prod.Evolucion && prod.Evolucion.length>=2){
    const last = prod.Evolucion[prod.Evolucion.length-1], prev = prod.Evolucion[prod.Evolucion.length-2];
    if(prev.prima>0){
      const delta = (last.prima-prev.prima)/prev.prima;
      tendencia = delta>0.05 ? {nivel:'ok', label:'Mejora'} : (delta<-0.05 ? {nivel:'bad', label:'Deterioro'} : {nivel:'warn', label:'Estable'});
    }
  }

  let sugerido = 'Todavía no hay datos suficientes para un diagnóstico — se completa con las primeras semanas de uso.';
  let focoSugerido = null;
  if(actividad.nivel!=='sd' && resultado.nivel!=='sd'){
    if(actividad.nivel==='ok' && (resultado.nivel==='warn'||resultado.nivel==='bad')){
      sugerido = 'Buena actividad pero no se traduce en resultado — antes de pedir más llamados, revisar calidad de entrevista, propuesta y manejo de objeciones.';
      focoSugerido = 'Presentación y propuesta';
    } else if((actividad.nivel==='warn'||actividad.nivel==='bad') && resultado.nivel==='ok'){
      sugerido = 'Buena conversión con poca actividad — el techo está en generación de oportunidades: foco en prospección, referidos y cartera.';
      focoSugerido = 'Prospección';
    } else if(actividad.nivel==='ok' && resultado.nivel==='ok'){
      sugerido = 'Viene bien en actividad y resultado — foco en sostener el ritmo y trabajar mix de producto y ticket promedio.';
      focoSugerido = 'Gestión de cartera';
    } else if(actividad.nivel==='bad' && (resultado.nivel==='bad'||resultado.nivel==='warn')){
      sugerido = 'Situación crítica en actividad y resultado — requiere intervención más intensiva esta semana, no solo coaching de rutina.';
      focoSugerido = 'Prospección';
    } else {
      sugerido = 'Situación mixta — conviene revisar juntos los datos de la semana antes de definir el foco.';
    }
  }

  return {actividad, resultado, tendencia, sugerido, focoSugerido};
}

function computeAlertas(asesorRow){
  const ms = minutasDe(asesorRow.Asesor, asesorRow.Supervisor);
  const alerts = [];
  if(ms.length===0){
    alerts.push({tipo:'sinDatos', label:'Sin minutas cargadas todavía', nivel:'warn'});
    return {alerts, nivel:'warn', ultima:null};
  }
  const ult = ms[ms.length-1];
  const esSemanaActual = ult.Semana === currentSemana();

  if(n(ult.Llamados)===0) alerts.push({tipo:'sinLlamados', label:'Sin llamados esta semana', nivel:'bad'});
  if(n(ult.Entrevistas)===0) alerts.push({tipo:'sinEntrevistas', label:'Sin entrevistas esta semana', nivel:'bad'});
  if(n(ult.ReferidosSolicitados)===0) alerts.push({tipo:'sinReferidos', label:'No pidió referidos', nivel:'warn'});
  if(prospeccionTotal(ult)===0) alerts.push({tipo:'sinProspeccion', label:'Sin prospección (cartera ni redes)', nivel:'bad'});
  if(n(ult.OportunidadesAbiertas)===0) alerts.push({tipo:'sinOportunidades', label:'Sin oportunidades nuevas', nivel:'warn'});
  if(agendaTotal(ult)===0) alerts.push({tipo:'agendaVacia', label:'Agenda vacía', nivel:'bad'});
  if(n(ult.IncrementosTrabajados)===0 && n(ult.Renovaciones)===0 && n(ult.CrossSelling)===0 && n(ult.Upselling)===0)
    alerts.push({tipo:'sinCartera', label:'Sin gestión de cartera', nivel:'warn'});

  // 3 semanas consecutivas sin actividad (llamados+entrevistas = 0)
  const last3 = ms.slice(-3);
  if(last3.length===3 && last3.every(m=> n(m.Llamados)+n(m.Entrevistas)===0))
    alerts.push({tipo:'tresSemanas', label:'3 semanas seguidas sin actividad', nivel:'bad'});

  // poco avance semana a semana
  if(ms.length>=2){
    const prev = ms[ms.length-2];
    const sPrev = actividadScore(prev), sUlt = actividadScore(ult);
    if(sPrev>0 && sUlt < sPrev*0.8)
      alerts.push({tipo:'bajaActividad', label:'Cayó la actividad vs. la semana anterior', nivel:'warn'});
    if(sPrev===0 && sUlt===0)
      alerts.push({tipo:'estancado', label:'Dos semanas seguidas en cero', nivel:'bad'});
  }

  // curva por antigüedad
  const meses = mesesAntiguedad(asesorRow.FechaIngreso);
  const etapa = etapaCurva(meses);
  const umbral = DATA.config.umbrales[etapa];
  if(umbral){
    const bajo = n(ult.Llamados)<umbral.llamados || n(ult.Entrevistas)<umbral.entrevistas ||
                 n(ult.ReferidosSolicitados)<umbral.referidosSolicitados || prospeccionTotal(ult)<umbral.prospeccion;
    if(bajo) alerts.push({tipo:'bajoCurva', label:'Por debajo del mínimo esperado para su etapa ('+etapaLabel(etapa)+')', nivel:'warn'});
  }

  if(!esSemanaActual) alerts.push({tipo:'semanaVieja', label:'No cargó minuta esta semana', nivel:'warn'});

  const nivel = alerts.some(a=>a.nivel==='bad') ? (alerts.filter(a=>a.nivel==='bad').length>=2 || alerts.some(a=>a.tipo==='tresSemanas')?'bad':'warn')
              : alerts.length>0 ? 'warn' : 'ok';
  return {alerts, nivel, ultima:ult};
}

function compromisosPendientesPrevios(asesor, supervisor, semanaActual){
  const ms = minutasDe(asesor,supervisor).filter(m=>m.Semana<semanaActual);
  if(!ms.length) return [];
  const prev = ms[ms.length-1];
  try{
    const arr = JSON.parse(prev.CompromisosJSON||'[]');
    return arr;
  }catch(e){ return []; }
}

  document.getElementById('app').innerHTML = '<div class="empty"><h3>Cargando…</h3></div>';
  try{ await apiLoad(); }catch(err){
    document.getElementById('app').innerHTML = '<div class="banner">No se pudo conectar al backend. Revisá la URL en BACKEND_URL dentro del HTML, o los permisos de la implementación de Apps Script.</div>';
    return;
  }
  render();
}

function render(){
  renderTopbar();
  const app = document.getElementById('app');
  if(NAV.screen==='login') app.innerHTML = screenLogin();
  else if(NAV.screen==='supHome') app.innerHTML = screenSupHome();
  else if(NAV.screen==='formulario') app.innerHTML = screenFormulario();
  else if(NAV.screen==='micro') app.innerHTML = screenMicro();
  else if(NAV.screen==='gerencial') app.innerHTML = screenGerencial();
  else if(NAV.screen==='jefezonal') app.innerHTML = screenJefeZonal();
  wireEvents();
}

/* ---------------------------- Pantalla: Home Supervisor ---------------------------- */
function screenSupHome(){
  const misAsesores = DATA.roster.filter(r=>r.Supervisor===NAV.supervisorName);
  const semanaAct = currentSemana();
  const cards = misAsesores.map(a=>{
    const {alerts, nivel} = computeAlertas(a);
    const ms = minutasDe(a.Asesor, a.Supervisor).slice(-8);

    const pulseBars = ms.map(m=>{
      const s = actividadScore(m);
      const h = Math.max(3, Math.round((s/maxScore)*32));
      return `<div class="bar ${s===0?'zero':''}" style="height:${h}px" title="Semana ${m.Semana}: score ${s}"></div>`;
    }).join('');
    const cargoEstaSemana = ms.length && ms[ms.length-1].Semana===semanaAct;
    const prodFullCard = produccionDe(a.Legajo);
    const prod = prodDelAnio(prodFullCard, anioMasReciente(prodFullCard));
    return `
    <div class="asesor-card">
      <div class="asesor-top">
        <div>
          <div class="asesor-name">${esc(a.Asesor)}</div>
          <div class="asesor-meta">${etapaLabel(etapaCurva(mesesAntiguedad(a.FechaIngreso)))} · Obj. $${fmt(a.ObjetivoMensual)}${prod?` · PMPM ${fmtMoney(prod.PMPM)}`:''}</div>

function gerRanking(zonaFiltro){
  let supervisores = [...new Set(DATA.roster.map(r=>r.Supervisor).filter(Boolean))];
  let rosterScope = DATA.roster;
  if(zonaFiltro){
    rosterScope = DATA.roster.filter(r=>r.Zona===zonaFiltro);
    supervisores = [...new Set(rosterScope.map(r=>r.Supervisor).filter(Boolean))];
  }
  const semanaAct = currentSemana();
  let totalAsesores=0, conMinutaEstaSemana=0, rojo=0;

  const rows = supervisores.map(sup=>{
    const asesores = rosterScope.filter(r=>r.Supervisor===sup);
    totalAsesores += asesores.length;
    let cargaron=0, cumplidos=0, totalComp=0, rojoSup=0, mejoraron=0, conDatosTendencia=0;
    asesores.forEach(a=>{
      const ms = minutasDe(a.Asesor, a.Supervisor);
      const ult = ms[ms.length-1];
      if(ult && ult.Semana===semanaAct){ cargaron++; conMinutaEstaSemana++; }
      const {nivel} = computeAlertas(a);
      if(nivel==='bad'){ rojoSup++; rojo++; }
      if(ms.length>=2){
        conDatosTendencia++;
        if(actividadScore(ms[ms.length-1]) > actividadScore(ms[ms.length-2])) mejoraron++;
      }
      ms.forEach(m=>{
        try{
          const seg = JSON.parse(m.SeguimientoCompromisosJSON||'{}');
          Object.values(seg).forEach(s=>{ totalComp++; if(s.estado==='Cumplido') cumplidos++; });
        }catch(e){}
      });
    });
    const pctCarga = asesores.length? Math.round(100*cargaron/asesores.length) : 0;
    const pctCumpl = totalComp? Math.round(100*cumplidos/totalComp) : null;
    const pctEfecto = conDatosTendencia? Math.round(100*mejoraron/conDatosTendencia) : null;
    const disciplina = Math.round((pctCarga*0.5) + ((pctCumpl===null?pctCarga:pctCumpl)*0.3) + ((pctEfecto===null?pctCarga:pctEfecto)*0.2));
    return {sup, asesores:asesores.length, pctCarga, pctCumpl, pctEfecto, rojoSup, disciplina};
  }).sort((a,b)=>b.disciplina-a.disciplina);

  const kpis = `
  <div class="grid grid-4" style="margin-bottom:18px">
    <div class="kpi"><div class="num">${supervisores.length}</div><div class="lbl">Supervisores</div></div>
    <div class="kpi"><div class="num">${totalAsesores}</div><div class="lbl">Asesores</div></div>
    <div class="kpi"><div class="num">${totalAsesores? Math.round(100*conMinutaEstaSemana/totalAsesores):0}%</div><div class="lbl">Con minuta esta semana</div></div>
    <div class="kpi"><div class="num" style="color:var(--bad)">${rojo}</div><div class="lbl">Asesores en alerta</div></div>
  </div>`;

  const explicacion = `
  <details class="collapsible" style="margin-bottom:16px">
    <summary>¿Qué es "Disciplina comercial" y cómo se calcula?</summary>
    <p style="font-size:13px;color:var(--text);margin-top:10px">Es un puntaje de 0 a 100 que mide <b>si el supervisor está gestionando bien a su equipo</b> — no cuánto venden sus asesores. Se arma con 3 partes:</p>
    <div class="grid grid-3" style="margin-top:10px">
      <div class="info-card">
        <b style="font-size:13px;color:var(--navy)">50% — % minuta esta semana</b>
        <div style="font-size:12.5px;color:var(--muted);margin-top:4px">De todos sus asesores, ¿con cuántos se reunió y cargó la minuta esta semana? Si se reunió con todos, este componente es 100%.</div>
      </div>
      <div class="info-card">
        <b style="font-size:13px;color:var(--navy)">30% — % compromisos cumplidos</b>
        <div style="font-size:12.5px;color:var(--muted);margin-top:4px">De todos los compromisos que sus asesores asumieron en minutas anteriores, ¿cuántos se marcaron como "Cumplido" en el seguimiento?</div>
      </div>
      <div class="info-card">
        <b style="font-size:13px;color:var(--navy)">20% — % con mejora de actividad</b>
        <div style="font-size:12.5px;color:var(--muted);margin-top:4px">De sus asesores con al menos 2 semanas cargadas, ¿a cuántos les subió la actividad (llamados, entrevistas, prospección) de una semana a la siguiente?</div>
      </div>
    </div>
    <p style="font-size:12px;color:var(--muted);margin-top:12px">Por qué se arma así: cargar minutas no sirve de nada si los compromisos no se cumplen, y cumplir compromisos no sirve si la actividad del asesor no mejora. El puntaje castiga a un supervisor que solo "completa el formulario" sin que eso cambie nada en su equipo.</p>
  </details>`;

  const table = `
  ${explicacion}
  <div class="card"><div class="table-wrap"><table>
    <thead><tr><th>Supervisor</th><th>Asesores</th><th>% minuta esta semana</th><th>% compromisos cumplidos</th><th>% con mejora de actividad</th><th>En alerta</th><th>Disciplina comercial</th></tr></thead>
    <tbody>
      ${rows.map(r=>`<tr>
        <td><b>${esc(r.sup)}</b></td>
        <td>${r.asesores}</td>
        <td>${r.pctCarga}%</td>
        <td>${r.pctCumpl===null?'—':r.pctCumpl+'%'}</td>
        <td>${r.pctEfecto===null?'—':r.pctEfecto+'%'}</td>
        <td>${r.rojoSup? `<span class="badge bad">${r.rojoSup}</span>` : '<span class="badge ok">0</span>'}</td>
        <td><b>${r.disciplina}</b>/100</td>
      </tr>`).join('') || `<tr><td colspan="7" style="text-align:center;color:var(--muted)">Sin supervisores cargados</td></tr>`}
    </tbody>
  </table></div>
  </div>`;

  return kpis + table;
}

function gerAlertas(zonaFiltro){
  let roster = zonaFiltro ? DATA.roster.filter(r=>r.Zona===zonaFiltro) : DATA.roster;

  const rows = roster.map(a=>({a, res:computeAlertas(a)})).filter(x=>x.res.alerts.length>0)
    .sort((x,y)=> (y.res.nivel==='bad'?2:1) - (x.res.nivel==='bad'?2:1));
  if(!rows.length) return `<div class="empty"><h3>Sin alertas activas</h3><p>Todos los asesores cargados están dentro de lo esperado.</p></div>`;
  return `<div class="card"><div class="table-wrap"><table>
    <thead><tr><th>Asesor</th><th>Supervisor</th><th>Nivel</th><th>Motivos</th></tr></thead>
    <tbody>

    </tr>`).join('')}
    </tbody>
  </table></div></div>`;
}

/* ---------------------------- Helpers de escape/formato ---------------------------- */
function esc(s){ return (s===undefined||s===null?'':String(s)).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function escAttr(s){ return esc(s); }
function fmt(v){ const x=Number(v); return isNaN(x)?'0':x.toLocaleString('es-AR'); }

/* ---------------------------- Eventos ---------------------------- */
/* ---------------------------- Carga de Excel en el navegador (Nómina + Ventas) ---------------------------- */
function excelToISO(v){
  if(v===null||v===undefined||v==='') return '';
  if(v instanceof Date) return toISO(v);
  if(typeof v==='number'){ const d=new Date(Date.UTC(1899,11,30)+v*86400000); return toISO(d); }
  if(typeof v==='string'){ const d=new Date(v); if(!isNaN(d)) return toISO(d); }
  return '';
}
function findSheet(wb, nameContains){
  const match = wb.SheetNames.find(nm=> nm.toLowerCase().includes(nameContains.toLowerCase()));
  return match || wb.SheetNames[0];
}
async function readWorkbook(file){
  const buf = await file.arrayBuffer();
  return XLSX.read(buf, {type:'array', cellDates:true});
}
function sheetRows(wb, sheetName){
  const ws = wb.Sheets[sheetName] || wb.Sheets[wb.SheetNames[0]];
  return XLSX.utils.sheet_to_json(ws, {header:1, raw:true, defval:null});
}
function titlecaseWord(s){ return (s||'').toString().split(' ').filter(Boolean).map(w=>w.charAt(0).toUpperCase()+w.slice(1).toLowerCase()).join(' '); }

function parseNominaWorkbook(wb){
  const rows = sheetRows(wb, 'Nómina');
  const headers = (rows[0]||[]).map(h=>(h||'').toString().trim());
  const data = [];
  for(let i=1;i<rows.length;i++){
    const r = rows[i];
    if(!r || r.every(v=>v===null||v==='')) continue;
    const obj = {}; headers.forEach((h,idx)=> obj[h]=r[idx]);
    data.push(obj);
  }
  const byLegajo = {};
  data.forEach(r=> byLegajo[r['Legajo']] = r);
  const nombreCompleto = r=> (titlecaseWord(r['Nombre'])+' '+titlecaseWord(r['Apellido'])).trim();
  const asesores = data.filter(r=> (r['Posición']||'').toString().toUpperCase().includes('ASESOR'));
  return asesores.map(a=>{
    const supRow = byLegajo[a['Legajo Superior Inmediato']];
    let supervisorNombre;
    if(supRow) supervisorNombre = nombreCompleto(supRow);
    else{
      const si = (a['Superior Inmediato']||'').toString();
      if(si.includes(',')){ const [ap,nom]=si.split(','); supervisorNombre = titlecaseWord(nom)+' '+titlecaseWord(ap); }
      else supervisorNombre = si;
    }
    const fing = excelToISO(a['Fecha Ingreso']);
    return {
      Legajo: a['Legajo'],
      Supervisor: supervisorNombre,
      Zona: a['Región']||'',
      Asesor: nombreCompleto(a),
      FechaIngreso: fing,
      ObjetivoMensual: objetivoMensualActual(fing)
    };
  });
}

function parseVentasWorkbook(wb){
  const rows = sheetRows(wb, 'Producción');
  const headers = (rows[2]||[]).map(h=>(h||'').toString().trim());
  const data = [];
  for(let i=3;i<rows.length;i++){
    const r = rows[i];
    if(!r) continue;
    if(r[0]==='Total') continue;
    if(r.every(v=>v===null||v==='')) continue;
    const obj = {}; headers.forEach((h,idx)=> obj[h]=r[idx]);
    data.push(obj);
  }
  return data;
}

const MESES_NOMBRE = {ENERO:1,FEBRERO:2,MARZO:3,ABRIL:4,MAYO:5,JUNIO:6,JULIO:7,AGOSTO:8,SEPTIEMBRE:9,OCTUBRE:10,NOVIEMBRE:11,DICIEMBRE:12};

/* "Base Consolidada 2025-2026" — otro formato posible de archivo de ventas: headers en la fila 1 (no la 3),
   Legajo directo (no hace falta cruzar por nombre), mes como texto ("Julio") en vez de número.
   Se detecta solo comparando los headers — no hace falta que el usuario elija el formato. */
function esFormatoConsolidado(headers){
  return headers.includes('Legajo') && headers.includes('Mes') && headers.includes('Pólizas');
}
function parseVentasConsolidadaWorkbook(wb){
  const ws = wb.Sheets[wb.SheetNames[0]];
  const rows = XLSX.utils.sheet_to_json(ws, {header:1, raw:true, defval:null});
  const headers = (rows[0]||[]).map(h=>(h||'').toString().trim());
  const data = [];
  for(let i=1;i<rows.length;i++){
    const r = rows[i];
    if(!r || r.every(v=>v===null||v==='')) continue;
    const obj = {}; headers.forEach((h,idx)=> obj[h]=r[idx]);
    data.push(obj);
  }
  // normalizo a los mismos nombres de campo que usa el formato "Producción por planes Acumulado"
  return data.map(r=>({
    Legajo: r['Legajo'],
    'Año': r['Año'],
    MES: MESES_NOMBRE[(r['Mes']||'').toString().trim().toUpperCase()] || null,
    'Prima Mes': r['Prima'],
    'Tipo Venta': r['Tipo de Venta'],
    Segmento: r['Segmento'],
    'Q Pólizas': r['Pólizas']
  })).filter(r=>r.MES);
}

/* Detecta el formato del archivo de ventas y lo parsea con la función que corresponda */
function parseVentasAutoDetect(wb){
  const ws = wb.Sheets[wb.SheetNames[0]];
  const primeraFila = (XLSX.utils.sheet_to_json(ws, {header:1, raw:true, defval:null})[0]||[]).map(h=>(h||'').toString().trim());
  if(esFormatoConsolidado(primeraFila)) return parseVentasConsolidadaWorkbook(wb);
  return parseVentasWorkbook(wb);
}

/* Cartera vigente — headers en la fila 1 (no fila 3 como Ventas), toma siempre la primera hoja
   porque el nombre de la hoja cambia de mes a mes ("JULIO 2026", "AGOSTO 2026", ...). */
function parseCarteraWorkbook(wb){
  const ws = wb.Sheets[wb.SheetNames[0]];
  const rows = XLSX.utils.sheet_to_json(ws, {header:1, raw:true, defval:null});
  const headers = (rows[0]||[]).map(h=>(h||'').toString().trim());
  const data = [];
  for(let i=1;i<rows.length;i++){
    const r = rows[i];
    if(!r || r.every(v=>v===null||v==='')) continue;
    const obj = {}; headers.forEach((h,idx)=> obj[h]=r[idx]);
    data.push(obj);
  }
  return data;
}

function normName(s){
  return (s||'').toString().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,' ').trim().toUpperCase();
}
function matchLegajoPorNombre(nombreRaw, roster){
  let s = (nombreRaw||'').trim();
  if(s.toUpperCase().startsWith('FVD ')) s = s.slice(4);
  const comma = s.indexOf(',');
  const ap = comma>-1 ? s.slice(0,comma) : s;
  const nom = comma>-1 ? s.slice(comma+1) : '';
  const apTokens = normName(ap).split(' ').filter(Boolean);
  const nomTokens = new Set(normName(nom).split(' ').filter(Boolean));
  const candidatos = roster.filter(r=>{
    const asesorTokens = new Set(normName(r.Asesor).split(' '));
    return apTokens.every(t=>asesorTokens.has(t));
  });
  if(candidatos.length===1) return candidatos[0].Legajo;
  if(candidatos.length>1){
    const desamb = candidatos.filter(r=>{
      const asesorTokens = normName(r.Asesor).split(' ');
      return asesorTokens.some(t=>nomTokens.has(t));
    });
    if(desamb.length===1) return desamb[0].Legajo;
  }
  return null;
}

function buildCartera(roster, records){
  const porLegajo = {};
  const vigentes = records.filter(r=> r['Estado de la póliza']==='Vigente');
  vigentes.forEach(r=>{
    const leg = matchLegajoPorNombre(r['NOMBRE_AGENTE_4'], roster);
    if(!leg) return;
    (porLegajo[leg] = porLegajo[leg]||[]).push(r);
  });
  const cartera = {};
  Object.keys(porLegajo).forEach(leg=>{
    const recs = porLegajo[leg];
    const clientes = {};
    recs.forEach(r=>{
      const doc = r['Documento - Asegurado'];
      if(!clientes[doc]) clientes[doc] = {nombre:r['Asegurado'], productos:new Set(), monedas:new Set()};
      clientes[doc].productos.add(r['Producto']);
      clientes[doc].monedas.add(r['Moneda']);
    });
    const mixMap = {};
    recs.forEach(r=>{ mixMap[r['Producto']] = (mixMap[r['Producto']]||0)+1; });
    const mixProductos = Object.keys(mixMap).map(k=>({producto:k, cant:mixMap[k]})).sort((a,b)=>b.cant-a.cant);
    const ventaPura = recs.filter(r=>r['CLASE_AGENTE_4']==='C1').length;
    const ventaMixta = recs.filter(r=>r['CLASE_AGENTE_4']==='C5').length;
    const usdSinZafiro = Object.values(clientes).filter(c=> c.monedas.has('DOLARES E.E.U.U.') && !c.productos.has('ZAFIRO')).map(c=>c.nombre);
    const unSoloProducto = Object.values(clientes).filter(c=> c.productos.size===1).map(c=>c.nombre);
    cartera[leg] = {
      TotalPolizas: recs.length,
      TotalClientes: Object.keys(clientes).length,
      MixProductos: mixProductos,
      VentaPura: ventaPura,
      VentaMixta: ventaMixta,
      OportunidadUsdSinZafiroCant: usdSinZafiro.length,
      OportunidadUsdSinZafiroEjemplos: usdSinZafiro.slice(0,8),
      ClientesUnSoloProductoCant: unSoloProducto.length,
      ClientesUnSoloProductoEjemplos: unSoloProducto.slice(0,8)
    };
  });
  return cartera;
}

function calcularPeriodoJS(recs, fing){
  const evolMap = {};
  recs.forEach(r=>{
    const anio = Number(r['Año']||new Date().getFullYear());
    const mes = Number(r['MES']);
    if(!mes) return;
    const ym = anio+'-'+String(mes).padStart(2,'0');
    evolMap[ym] = (evolMap[ym]||0) + (Number(r['Prima Mes'])||0);
  });
  const evolucion = Object.keys(evolMap).sort().map(ym=>{
    const [anio,mes] = ym.split('-').map(Number);
    const esSr = fing ? esSeniorEnFecha(fing, anio, mes) : true;
    const obj = objetivoDelMes(anio, mes, esSr);
    return {ym, prima: Math.round(evolMap[ym]), objetivo: obj, alcance: obj ? Math.round(100*evolMap[ym]/obj) : 0};
  });
  const primaTotal = recs.reduce((s,r)=> s+(Number(r['Prima Mes'])||0), 0);
  const ventasNuevas = recs.filter(r=> r['Tipo Venta']==='VI');
  const incrementos = recs.filter(r=> r['Tipo Venta']==='Bonus');
  const ap = recs.filter(r=> r['Segmento']==='AP Ind');
  const nMeses = evolucion.length||1;
  const alcances = evolucion.map(e=> Math.min(200, e.alcance));
  const mix = {};
  recs.forEach(r=>{ const seg = r['Segmento']||'Otro'; mix[seg] = (mix[seg]||0) + (Number(r['Prima Mes'])||0); });
  const mixTotal = Object.values(mix).reduce((a,b)=>a+b,0) || 1;
  const mixProductos = Object.keys(mix).map(k=>({producto:k, prima:Math.round(mix[k]), pct:Math.round(100*mix[k]/mixTotal)})).sort((a,b)=>b.prima-a.prima);
  const TIPO_LABEL = {VI:'Nuevas', Bonus:'Incrementos', AP:'AP'};
  const cruce = {};
  recs.forEach(r=>{
    const seg = r['Segmento']||'Otro';
    const tv = r['Tipo Venta']||'';
    const key = seg+'|'+tv;
    if(!cruce[key]) cruce[key] = {producto:seg, tipoVenta:tv, tipoLabel:TIPO_LABEL[tv]||tv, cant:0, prima:0};
    cruce[key].cant += Number(r['Q Pólizas'])||0;
    cruce[key].prima += Number(r['Prima Mes'])||0;
  });
  const mixPorTipo = Object.values(cruce).map(m=>({...m, cant:Math.round(m.cant), prima:Math.round(m.prima)})).sort((a,b)=>b.prima-a.prima);
  const monSplitMap = {};
  recs.forEach(r=>{ if(r['Mon']===undefined) return; const mon = r['Mon']||'ARS'; monSplitMap[mon] = (monSplitMap[mon]||0) + (Number(r['Prima Mes'])||0); });
  const monTotal = Object.values(monSplitMap).reduce((a,b)=>a+b,0) || 1;
  const monedaSplit = Object.keys(monSplitMap).length ? Object.keys(monSplitMap).map(k=>({moneda:k, prima:Math.round(monSplitMap[k]), pct:Math.round(100*monSplitMap[k]/monTotal)})).sort((a,b)=>b.prima-a.prima) : undefined;
  return {
    PrimaTotal: Math.round(primaTotal),
    PMPM: Math.round(primaTotal/nMeses),
    MesesConDatos: nMeses,
    AlcancePromedio: alcances.length ? Math.round(alcances.reduce((a,b)=>a+b,0)/alcances.length) : null,
    VentasNuevasCant: ventasNuevas.length,
    VentasNuevasPrima: Math.round(ventasNuevas.reduce((s,r)=>s+(Number(r['Prima Mes'])||0),0)),
    IncrementosCant: incrementos.length,
    IncrementosPrima: Math.round(incrementos.reduce((s,r)=>s+(Number(r['Prima Mes'])||0),0)),
    APCant: ap.length,
    APPrima: Math.round(ap.reduce((s,r)=>s+(Number(r['Prima Mes'])||0),0)),
    Polizas: Math.round(recs.reduce((s,r)=> s+(Number(r['Q Pólizas'])||0), 0)),
    Evolucion: evolucion,
    MixProductos: mixProductos,
    MixPorTipo: mixPorTipo,
    MonedaSplit: monedaSplit
  };
}

function buildProduccion(rosterByLegajo, records){
  const byLegajo = {};
  records.forEach(r=>{
    const leg = String(r['Legajo']);
    (byLegajo[leg] = byLegajo[leg]||[]).push(r);
  });
  const produccion = {};
  Object.keys(byLegajo).forEach(legajo=>{
    const recs = byLegajo[legajo];
    const fing = (rosterByLegajo[legajo]||{}).FechaIngreso || null;
    const porAnio = {};
    recs.forEach(r=>{
      const anio = String(r['Año']||new Date().getFullYear());
      (porAnio[anio] = porAnio[anio]||[]).push(r);
    });
    const anios = Object.keys(porAnio).map(Number).sort((a,b)=>a-b);
    const PorAnio = {};
    anios.forEach(anio=>{ PorAnio[String(anio)] = calcularPeriodoJS(porAnio[String(anio)], fing); });
    produccion[legajo] = {Anios: anios, PorAnio};
  });
  return produccion;
}

    const minuta = DATA.minutas.find(m=>m.Asesor===NAV.asesor && m.Supervisor===NAV.supervisorName && m.Semana===semana);
    if(!minuta) return;
    const estados = {};
    $$('.micro-estado.sel-cumplido, .micro-estado.sel-parcial, .micro-estado.sel-incumplido').forEach(b=>{
      estados[b.getAttribute('data-idx')] = b.getAttribute('data-val');
    });
    minuta.MicroseguimientoJSON = JSON.stringify(estados);
    $('#btnGuardarMicro').disabled = true;
    $('#btnGuardarMicro').textContent = 'Guardando…';
    try{ await apiSaveMinuta(minuta); go({screen:'supHome', asesor:null}); }
    catch(e){ alert('No se pudo guardar.'); $('#btnGuardarMicro').disabled=false; $('#btnGuardarMicro').textContent='Guardar chequeo'; }
  };

  // --- formulario: coaching, foco de la semana ---
  if($('#btnUsarFocoSugerido')) $('#btnUsarFocoSugerido').onclick = ()=>{
    const foco = $('#btnUsarFocoSugerido').getAttribute('data-foco');
    if($('#f_Foco')){ $('#f_Foco').value = foco; $('#f_Foco').dispatchEvent(new Event('change')); }
    document.getElementById('f_Foco').scrollIntoView({behavior:'smooth', block:'center'});
  };
  if($('#f_Foco')) $('#f_Foco').onchange = ()=>{
    const respuestasActuales = {};
    $$('.coach-resp').forEach(t=> respuestasActuales[t.getAttribute('data-idx')] = t.value);
    $('#coachingPreguntas').innerHTML = coachingQuestionsHTML(currentSemana(), $('#f_Foco').value, respuestasActuales);
  };

  // --- formulario: compromisos nuevos ---
  if($('#btnAddCompromiso')) $('#btnAddCompromiso').onclick = ()=>{
    const box = $('#compromisosBox');
    const count = box.querySelectorAll('.compromiso-row').length;
    if(count>=5) return alert('Máximo 5 compromisos por reunión.');
    box.insertAdjacentHTML('beforeend', compromisoRow({}, count));
  };

  // --- formulario: panel de producción (filtros, simulador) y selector de año ---
  {
    const asesorRowProd = DATA.roster.find(r=>r.Asesor===NAV.asesor && r.Supervisor===NAV.supervisorName);
    const prodFullW = asesorRowProd ? produccionDe(asesorRowProd.Legajo) : null;
    const wireProduccionBox = (prodSel)=>{
      if($('#filtroProducto') || $('#filtroTipo')){
        const aplicarFiltro = ()=>{
          const p = $('#filtroProducto') ? $('#filtroProducto').value : '';
          const t = $('#filtroTipo') ? $('#filtroTipo').value : '';
          $$('#tablaMixPorTipo tbody tr').forEach(tr=>{
            const okP = !p || tr.getAttribute('data-producto')===p;
            const okT = !t || tr.getAttribute('data-tipo')===t;
            tr.style.display = (okP && okT) ? '' : 'none';
          });
        };
        if($('#filtroProducto')) $('#filtroProducto').onchange = aplicarFiltro;
        if($('#filtroTipo')) $('#filtroTipo').onchange = aplicarFiltro;
      }
      if($('#simPctVN')){
        const calcularSim = ()=>{
          if(!prodSel || !prodSel.PrimaTotal){ $('#simResultado').textContent=''; return; }
          const pct = Number($('#simPctVN').value)||0;
          const incremento = Math.round(prodSel.VentasNuevasPrima * pct/100);
          const nuevaPrimaTotal = prodSel.PrimaTotal + incremento;
          const factor = nuevaPrimaTotal / prodSel.PrimaTotal;
          const nuevoAlcance = prodSel.AlcancePromedio!=null ? Math.round(prodSel.AlcancePromedio * factor) : null;
          $('#simResultado').innerHTML = `Hubieras sumado <b>${fmtMoney(incremento)}</b> más de prima (total ${fmtMoney(nuevaPrimaTotal)})`+
            (nuevoAlcance!=null ? ` — el alcance promedio del período pasaría de <b>${prodSel.AlcancePromedio}%</b> a <b>~${nuevoAlcance}%</b> (aproximado, asume el mismo aumento en todos los meses).` : '.');
        };
        $('#simPctVN').oninput = calcularSim;
        calcularSim();
      }
    };
    if($('#f_AnioProduccion') || $('#tablaMixPorTipo') || $('#simPctVN')){
      const anioInicial = $('#f_AnioProduccion') ? Number($('#f_AnioProduccion').value) : anioMasReciente(prodFullW);
      wireProduccionBox(prodDelAnio(prodFullW, anioInicial));
    }
    if($('#f_AnioProduccion')) $('#f_AnioProduccion').onchange = ()=>{
      const anio = Number($('#f_AnioProduccion').value);
      const prodSel = prodDelAnio(prodFullW, anio);
      document.getElementById('produccionAnioBox').innerHTML = produccionAnioBodyHTML(prodSel);
      const h3 = document.querySelector('.section-title h3');
      if(h3) h3.textContent = 'Cómo viene en ' + anio;
      wireProduccionBox(prodSel);
    };
  }

  // --- formulario: objetivo y avance en vivo ---
  if($('#f_PrimaSemana')){
    const objMensual = objetivoMensualActual(DATA.roster.find(r=>r.Asesor===NAV.asesor && r.Supervisor===NAV.supervisorName)?.FechaIngreso);
    const acumPrevio = avanceMensualPrevio(NAV.asesor, NAV.supervisorName, currentSemana());
    $('#f_PrimaSemana').oninput = ()=>{
      const total = acumPrevio + (Number($('#f_PrimaSemana').value)||0);
      $('#acumMesNum').textContent = fmtMoney(total);
      const pct = Math.min(100, Math.round(100*total/(objMensual||1)));
      $('#acumMesFill').style.width = pct+'%';
      $('#acumMesFill').classList.toggle('over', total>=objMensual);
    };
  }
  if($('#f_Llamados')){
    $('#f_Llamados').oninput = $('#f_MetaLlamados').oninput = ()=>{
      const val = Number($('#f_Llamados').value)||0;
      const meta = Number($('#f_MetaLlamados').value)||1;
      const pct = Math.min(100, Math.round(100*val/meta));
      $('#llamadosFill').style.width = pct+'%';
      $('#llamadosFill').classList.toggle('over', val>=meta);
    };
  }

  if($('#btnGuardarMeta')) $('#btnGuardarMeta').onclick = async ()=>{
    const val = Number($('#f_MetaLlamados').value)||0;
    const row = DATA.roster.find(r=>r.Asesor===NAV.asesor && r.Supervisor===NAV.supervisorName);
    if(row){
      row.MetaLlamados = val;
      $('#btnGuardarMeta').disabled = true;
      $('#btnGuardarMeta').textContent = 'Guardando…';
      try{ await apiSaveRoster(DATA.roster); }catch(e){}
      $('#btnGuardarMeta').disabled = false;
      $('#btnGuardarMeta').textContent = 'Guardar meta';
    }
  };

  if($('#btnGuardar')) $('#btnGuardar').onclick = async ()=>{
    const minuta = collectMinutaFromForm();
    $('#btnGuardar').disabled = true;
    $('#btnGuardar').textContent = 'Guardando…';
    try{
      await apiSaveMinuta(minuta);
      alert('Reunión guardada.');
      go({screen:'supHome', asesor:null});
    }catch(e){
      alert('No se pudo guardar. Revisá la conexión al backend.');
      $('#btnGuardar').disabled = false;
      $('#btnGuardar').textContent = 'Guardar reunión';
    }
  };
  if($('#btnCancelar')) $('#btnCancelar').onclick = ()=> go({screen:'supHome', asesor:null});

  // --- gerencial: carga de excel (nómina + ventas) ---
  ['f_uploadNomina','f_uploadVentasActual','f_uploadVentasAnterior','f_uploadCartera'].forEach(id=>{
    const inp = $('#'+id);
    if(!inp) return;
    inp.onchange = ()=>{
      const card = inp.closest('.upload-card');
      if(inp.files[0]){ card.classList.add('filled'); card.querySelector('.sub').textContent = inp.files[0].name; }
      else{ card.classList.remove('filled'); }
    };
  });
  if($('#btnProcesarExcel')) $('#btnProcesarExcel').onclick = async ()=>{
    const fNomina = $('#f_uploadNomina').files[0];
    const fVA = $('#f_uploadVentasActual').files[0];
    const fVP = $('#f_uploadVentasAnterior').files[0];
    const fCartera = $('#f_uploadCartera').files[0];
    const status = $('#procesarStatus');
    if(!fNomina && !fVA && !fCartera){ alert('Subí al menos la Nómina, un archivo de Ventas o el de Cartera vigente.'); return; }
    status.textContent = 'Procesando…';
    $('#btnProcesarExcel').disabled = true;
    try{
      let newRoster = DATA.roster;
      if(fNomina){
        const wb = await readWorkbook(fNomina);
        newRoster = parseNominaWorkbook(wb);
        newRoster.forEach(r=>{
          const prev = DATA.roster.find(x=>x.Asesor===r.Asesor && x.Supervisor===r.Supervisor);
          if(prev && prev.MetaLlamados) r.MetaLlamados = prev.MetaLlamados;
        });
      }
      let records = [];
      let anioActual = null;
      if(fVA){
        const wb = await readWorkbook(fVA);
        const recs = parseVentasAutoDetect(wb);
        records = records.concat(recs);
        const anios = recs.map(r=>Number(r['Año'])).filter(Boolean);
        if(anios.length) anioActual = anios.sort((a,b)=> anios.filter(v=>v===a).length - anios.filter(v=>v===b).length).pop();
      }
      if(fVP){
        const wb = await readWorkbook(fVP);
        let recs = parseVentasAutoDetect(wb);
        if(anioActual) recs = recs.filter(r=> Number(r['Año'])!==anioActual); // evita filas del año actual duplicadas en el archivo anterior
        records = records.concat(recs);
      }
      const rosterByLegajo = {};
      newRoster.forEach(r=> rosterByLegajo[String(r.Legajo)] = r);
      let newProduccion = (DATA.config.produccion)||{};
      if(records.length) newProduccion = buildProduccion(rosterByLegajo, records);

      let newCartera = DATA.config.cartera || {};
      let sinCruzar = 0;
      if(fCartera){
        const wb = await readWorkbook(fCartera);
        const carteraRecs = parseCarteraWorkbook(wb);
        newCartera = buildCartera(newRoster, carteraRecs);
        const vigentes = carteraRecs.filter(r=>r['Estado de la póliza']==='Vigente').length;
        const cruzadas = Object.values(newCartera).reduce((s,c)=>s+c.TotalPolizas,0);
        sinCruzar = vigentes - cruzadas;
      }

      DATA.roster = newRoster;
      DATA.config.produccion = newProduccion;
      DATA.config.produccionActualizada = currentSemana();
      if(fCartera) DATA.config.cartera = newCartera;
      await apiSaveRoster(DATA.roster);
      await apiSaveConfig(DATA.config);
      status.textContent = '✓ Actualizado' + (fCartera ? ` (cartera: ${sinCruzar} pólizas de asesores no matcheados por nombre, revisar)` : '');
      render();
    }catch(err){
      console.error(err);
      status.textContent = 'Error al procesar — revisá que el archivo tenga el formato esperado.';
    }finally{
      if($('#btnProcesarExcel')) $('#btnProcesarExcel').disabled = false;
    }
  };

  // --- gerencial: correcciones manuales de producción ---
  if($('#btnAgregarCorreccion')) $('#btnAgregarCorreccion').onclick = async ()=>{
    const legajo = $('#corr_legajo').value;
    const ym = $('#corr_ym').value;
    const prima = Number($('#corr_prima').value)||0;
    if(!legajo || !ym || !prima) return alert('Elegí asesor, mes y prima.');
    DATA.config.correccionesProduccion = DATA.config.correccionesProduccion || [];
    DATA.config.correccionesProduccion.push({
      legajo, ym,
      tipoVenta: $('#corr_tipo').value,
      prima,
      polizas: Number($('#corr_polizas').value)||0,
      producto: $('#corr_producto').value,
      motivo: $('#corr_motivo').value
    });
    await apiSaveConfig(DATA.config);
    render();
  };
  $$('[data-del-correccion]').forEach(b=> b.onclick = async ()=>{
    const idx = Number(b.getAttribute('data-del-correccion'));
    DATA.config.correccionesProduccion.splice(idx,1);
    await apiSaveConfig(DATA.config);
    render();
  });

  // --- gerencial: config roster ---
  if($('#btnCargarRosterInicial')) $('#btnCargarRosterInicial').onclick = ()=>{
    DATA.roster = ROSTER_INICIAL.slice();
    render();
  };
  if($('#btnAddAsesor')) $('#btnAddAsesor').onclick = ()=>{
    DATA.roster.push({Supervisor:NAV.supervisorName||'', Zona:'', Asesor:'', FechaIngreso:'', ObjetivoMensual:0});
    render();
  };
  $$('[data-del-asesor]').forEach(b=> b.onclick = ()=>{
    const idx = Number(b.getAttribute('data-del-asesor'));
    DATA.roster.splice(idx,1);
    render();
  });
  if($('#btnSaveRoster')) $('#btnSaveRoster').onclick = async ()=>{
    $$('.r-field').forEach(inp=>{
      const idx = Number(inp.getAttribute('data-idx')), key = inp.getAttribute('data-key');
      DATA.roster[idx][key] = inp.value;
    });
    await apiSaveRoster(DATA.roster);
    alert('Roster guardado.');
    render();
  };

  // --- gerencial: config umbrales y preguntas ---
  if($('#btnAddPregunta')) $('#btnAddPregunta').onclick = ()=>{
    DATA.config.preguntasCoaching.push({texto:'', foco:'General'});
    render();
  };
  $$('[data-del-pregunta]').forEach(b=> b.onclick = ()=>{
    const idx = Number(b.getAttribute('data-del-pregunta'));
    DATA.config.preguntasCoaching.splice(idx,1);
    render();
  });
  if($('#btnSaveConfig')) $('#btnSaveConfig').onclick = async ()=>{
    $$('.umbral-field').forEach(inp=>{
      DATA.config.umbrales[inp.getAttribute('data-etapa')][inp.getAttribute('data-key')] = Number(inp.value)||0;
    });
    $$('.pregunta-field').forEach(inp=>{
      const idx = Number(inp.getAttribute('data-idx'));
      const prev = DATA.config.preguntasCoaching[idx];
      DATA.config.preguntasCoaching[idx] = {texto: inp.value, foco: (typeof prev==='object'&&prev)?prev.foco:'General'};
    });
    $$('.pregunta-foco').forEach(sel=>{
      const idx = Number(sel.getAttribute('data-idx'));
      if(DATA.config.preguntasCoaching[idx]) DATA.config.preguntasCoaching[idx].foco = sel.value;
    });
    if($('#f_PreguntasPorSemana')) DATA.config.preguntasPorSemana = Math.max(1, Math.min(6, Number($('#f_PreguntasPorSemana').value)||3));
    await apiSaveConfig(DATA.config);
    alert('Configuración guardada.');
    render();
  };
}

function collectMinutaFromForm(){
  const $$ = sel=>Array.from(document.querySelectorAll(sel));
  const minuta = {Semana: currentSemana(), Supervisor: NAV.supervisorName, Asesor: NAV.asesor};

  $$('.act-field').forEach(inp=> minuta[inp.getAttribute('data-key')] = Number(inp.value)||0);
  const nseg = document.getElementById('f_NuevosSegmentos');
  minuta.NuevosSegmentos = nseg ? nseg.value : '';
  const primaSemana = document.getElementById('f_PrimaSemana');
  minuta.PrimaSemana = primaSemana ? (Number(primaSemana.value)||0) : 0;

  const respuestas = {};
  $$('.coach-resp').forEach(t=> respuestas[t.getAttribute('data-idx')] = t.value);
  minuta.RespuestasCoachingJSON = JSON.stringify(respuestas);

  const compromisos = [];
  $$('.compromiso-row').forEach(row=>{
    const idx = row.getAttribute('data-idx');
    const texto = row.querySelector('.c-texto').value;
    if(!texto) return;
    compromisos.push({
      texto,
      responsable: row.querySelector('.c-resp').value,
      fecha: row.querySelector('.c-fecha').value,
      indicador: row.querySelector('.c-ind').value,
      resultadoEsperado: row.querySelector('.c-res').value,
      estado: 'Pendiente'
    });
  });
  minuta.CompromisosJSON = JSON.stringify(compromisos.slice(0,5));

  const seguimiento = {};
  $$('.seguimiento-row').forEach(row=>{
    const idx = row.getAttribute('data-idx');
    const estadoBtn = row.querySelector('.seg-estado.sel-cumplido, .seg-estado.sel-parcial, .seg-estado.sel-incumplido');
    const motivo = row.querySelector('.seg-motivo').value;
    const causaSel = row.querySelector('.seg-causa');
    seguimiento[idx] = {estado: estadoBtn? estadoBtn.getAttribute('data-val') : '', motivo, causa: causaSel?causaSel.value:''};
  });
  minuta.SeguimientoCompromisosJSON = JSON.stringify(seguimiento);

  const fFoco = document.getElementById('f_Foco');
  minuta.Foco = fFoco ? fFoco.value : '';
  const fCompSup = document.getElementById('f_CompromisoSupervisor');
  minuta.CompromisoSupervisor = fCompSup ? fCompSup.value : '';
  const fHallazgo = document.getElementById('f_HallazgoClave');
  minuta.HallazgoClave = fHallazgo ? fHallazgo.value : '';

  return minuta;
}

boot();
</script>
</body>
</html>
